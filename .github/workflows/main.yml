name: penny-trader

on:
  schedule:
    # Hourly at :35 UTC, weekdays. Covers both EST (14:30) and EDT (13:30) opens.
    # The RTH gate below exits fast when the market is closed, so the wasted
    # runtime is a single `date` call — not a pip install.
    - cron: "35 13-20 * * 1-5"
  workflow_dispatch:

concurrency:
  group: penny-trader
  cancel-in-progress: false

permissions:
  contents: write       # needed to push the state/ commit to main
  issues: write         # needed for failure alerting

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Gate the whole job on actual ET time so off-hours runs cost nothing.
      - name: RTH gate (America/New_York)
        id: gate
        run: |
          T=$(TZ=America/New_York date +%H%M)
          if [ "$T" -ge 0925 ] && [ "$T" -le 1605 ]; then
            echo run=true >> "$GITHUB_OUTPUT"
          else
            echo run=false >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout main
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Setup Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Run strategies
        if: steps.gate.outputs.run == 'true'
        run: python penny_trader.py
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: ${{ vars.ALPACA_PAPER || 'true' }}
          DRY_RUN: ${{ vars.DRY_RUN || 'false' }}
          RISK_PER_TRADE_PCT: ${{ vars.RISK_PER_TRADE_PCT }}
          MAX_OPEN_POSITIONS: ${{ vars.MAX_OPEN_POSITIONS }}
          REWARD_RISK: ${{ vars.REWARD_RISK }}
          RUN_INTERVAL_MIN: ${{ vars.RUN_INTERVAL_MIN || '60' }}
          MIN_BAR_DENSITY: ${{ vars.MIN_BAR_DENSITY || '0.6' }}
          MIN_VOLUME_FOR_RVOL: ${{ vars.MIN_VOLUME_FOR_RVOL || '10000' }}
          EXTRA_TICKERS: ${{ vars.EXTRA_TICKERS }}

      - name: Update P&L ledger
        if: steps.gate.outputs.run == 'true'
        run: python monitor.py
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: ${{ vars.ALPACA_PAPER || 'true' }}

      - name: Commit state to main
        if: always() && steps.gate.outputs.run == 'true'
        run: |
          set -eo pipefail
          git config user.name  "penny-bot"
          git config user.email "penny-bot@users.noreply.github.com"
          mkdir -p state
          git add -A state
          if git diff --cached --quiet; then
            echo "No state changes."
            exit 0
          fi
          git commit -m "state $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signals-${{ github.run_id }}
          path: signals.csv
          if-no-files-found: warn

      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "penny-trader failed $(date -u +%Y-%m-%dT%H:%MZ)" \
            --body "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --label "bot-failure" || true

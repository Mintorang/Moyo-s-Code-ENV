name: penny-trader

on:
  schedule:
    # Every 10 minutes, 13:00-20:59 UTC (covers the US session in both EST and EDT).
    # Runs while the market is closed exit within seconds.
    - cron: "*/10 13-20 * * 1-5"
  workflow_dispatch:

concurrency:
  group: penny-trader
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run strategies once
        run: python penny_trader.py
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: ${{ vars.ALPACA_PAPER || 'true' }}
          DRY_RUN: ${{ vars.DRY_RUN || 'false' }}
          RISK_PER_TRADE_PCT: ${{ vars.RISK_PER_TRADE_PCT }}
          MAX_OPEN_POSITIONS: ${{ vars.MAX_OPEN_POSITIONS }}
          REWARD_RISK: ${{ vars.REWARD_RISK }}
          RUN_INTERVAL_MIN: ${{ vars.RUN_INTERVAL_MIN || '10' }}
          EXTRA_TICKERS: ${{ vars.EXTRA_TICKERS }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signals-${{ github.run_id }}
          path: signals.csv
          if-no-files-found: ignore

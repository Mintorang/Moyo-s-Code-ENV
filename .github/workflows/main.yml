name: penny-trader

on:
  schedule:
    # Hourly at :35 UTC, weekdays. This covers 9:35-3:35 p.m.
    # America/New_York in both EST and EDT; the gate below checks local time.
    - cron: "35 13-20 * * 1-5"
  workflow_dispatch:

concurrency:
  group: penny-trader
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: RTH gate (America/New_York)
        id: gate
        shell: bash
        run: |
          echo "UTC: $(date -u '+%Y-%m-%d %H:%M:%S %Z')"
          echo "New York: $(TZ=America/New_York date '+%Y-%m-%d %H:%M:%S %Z')"

          DOW=$(TZ=America/New_York date +%u)
          HOUR=$(TZ=America/New_York date +%H)
          MINUTE=$(TZ=America/New_York date +%M)
          NOW_MIN=$((10#$HOUR * 60 + 10#$MINUTE))

          # Allow weekday runs from 9:25 a.m. until 4:00 p.m. ET.
          if [ "$DOW" -le 5 ] && [ "$NOW_MIN" -ge 565 ] && [ "$NOW_MIN" -lt 960 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Inside the weekday trading-hours window."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Outside the weekday trading-hours window; trading steps will be skipped."
          fi

      - name: Checkout main
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Setup Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Run strategies
        if: steps.gate.outputs.run == 'true'
        run: python penny_trader.py
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: ${{ vars.ALPACA_PAPER || 'true' }}
          DRY_RUN: ${{ vars.DRY_RUN || 'false' }}
          RISK_PER_TRADE_PCT: ${{ vars.RISK_PER_TRADE_PCT }}
          MAX_OPEN_POSITIONS: ${{ vars.MAX_OPEN_POSITIONS }}
          REWARD_RISK: ${{ vars.REWARD_RISK }}
          RUN_INTERVAL_MIN: ${{ vars.RUN_INTERVAL_MIN || '60' }}
          MIN_BAR_DENSITY: ${{ vars.MIN_BAR_DENSITY || '0.6' }}
          MIN_VOLUME_FOR_RVOL: ${{ vars.MIN_VOLUME_FOR_RVOL || '10000' }}
          EXTRA_TICKERS: ${{ vars.EXTRA_TICKERS }}

      - name: Update P&L ledger
        if: steps.gate.outputs.run == 'true'
        run: python monitor.py
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: ${{ vars.ALPACA_PAPER || 'true' }}

      - name: Commit state to main
        if: always() && steps.gate.outputs.run == 'true'
        run: |
          set -eo pipefail
          git config user.name "penny-bot"
          git config user.email "penny-bot@users.noreply.github.com"
          mkdir -p state
          git add -A state
          if git diff --cached --quiet; then
            echo "No state changes."
            exit 0
          fi
          git commit -m "state $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signals-${{ github.run_id }}
          path: signals.csv
          if-no-files-found: warn

      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "penny-trader failed $(date -u +%Y-%m-%dT%H:%MZ)" \
            --body "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --label "bot-failure" || true

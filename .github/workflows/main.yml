name: penny-trader

on:
  schedule:
    # Hourly at :35 UTC covers 9:35 ET onward in both EST and EDT; closed-market runs exit instantly.
    - cron: "35 13-20 * * 1-5"
    # Extra late run so positions get flattened ~10 min before the close.
    - cron: "50 19-20 * * 1-5"
  workflow_dispatch:

concurrency:
  group: penny-trader
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run strategies once
        run: python penny_trader.py
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: ${{ vars.ALPACA_PAPER || 'true' }}
          DRY_RUN: ${{ vars.DRY_RUN || 'false' }}
          RISK_PER_TRADE_PCT: ${{ vars.RISK_PER_TRADE_PCT }}
          MAX_OPEN_POSITIONS: ${{ vars.MAX_OPEN_POSITIONS }}
          REWARD_RISK: ${{ vars.REWARD_RISK }}
          EXTRA_TICKERS: ${{ vars.EXTRA_TICKERS }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signals-${{ github.run_id }}
          path: signals.csv
          if-no-files-found: ignore

name: Hourly Penny Trader

on:
  schedule:
    # Runs every hour at minute 0 (Note: GitHub cron schedules use UTC time)
    - cron: '0 * * * *'
  workflow_dispatch: # Allows you to trigger it manually anytime from GitHub Actions tab

jobs:
  trade:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout your code from the repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # 3. Install required dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install alpaca-py pandas numpy yfinance python-dotenv

      # 4. Run your trading script using GitHub Secrets as environment variables
      - name: Run Trader Script
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          python penny_trader.py
